[package]
name = "ai-nexus"
version = "0.1.0"
edition = "2021"
description = "A powerful agent platform orchestrating skills via Gemini API"

[dependencies]
tokio = { version = "1.34", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1.74"
anyhow = "1.0.75"
uuid = { version = "1.6", features = ["v4", "fast-rng", "macro-diagnostics"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_yaml = "0.9.34"
config = "0.15.25"
dotenvy = "0.15.7"
notify = "8.2.0"
arc-swap = "1.9.2"
regex = "1.12.4"
lazy_static = "1.5.0"

teloxide = "0.17.0"
axum = "0.7.5"
tower-http = { version = "0.5.2", features = ["cors"] }
jsonwebtoken = "9.2.0"
chrono = "0.4.31"
postcard = "1.1.3"
wasmtime = "46.0.1"
wasmtime-wasi = "46.0.1"
sha2 = "0.10.8"
cron = "0.12.1"
serde_bytes = "0.11.19"
memmap2 = "0.9.11"
dashmap = "6.2.1"
petgraph = { version = "0.6", features = ["serde-1"] }
urlencoding = "2.1.3"
[workspace]
members = [
    ".",
    "src/ainexus-test",
    "src/ainexus-test/test-wasm-skill",
    "src/ainexus-test/json-formatter",
    "src/ainexus-test/markdown-table"
]
