<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Nexus - Settings</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg-color: #0f1115;
            --surface-color: rgba(25, 28, 36, 0.6);
            --surface-border: rgba(255, 255, 255, 0.08);
            --primary-color: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --secondary-color: #10b981;
            --accent-color: #8b5cf6;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --sidebar-width: 280px;
            --font-family: 'Inter', sans-serif;
            --transition-speed: 0.3s;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15), transparent 25%);
            background-attachment: fixed;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: var(--surface-color);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-right: 1px solid var(--surface-border);
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 3rem;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand i {
            font-size: 2rem;
            color: var(--primary-color);
            filter: drop-shadow(0 0 8px var(--primary-glow));
        }

        .nav-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.875rem 1rem;
            border-radius: 12px;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: all var(--transition-speed) ease;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .nav-item.active {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(139, 92, 246, 0.1));
            color: var(--primary-color);
            border: 1px solid rgba(99, 102, 241, 0.2);
            box-shadow: inset 0 0 20px rgba(99, 102, 241, 0.05);
        }

        .main-content {
            margin-left: var(--sidebar-width);
            flex: 1;
            padding: 2.5rem 3rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-title h1 {
            font-size: 1.875rem;
            font-weight: 600;
            letter-spacing: -0.025em;
        }

        .page-title p {
            color: var(--text-secondary);
            margin-top: 0.25rem;
            font-size: 0.95rem;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: var(--surface-color);
            border: 1px solid var(--surface-border);
            padding: 0.5rem 1rem 0.5rem 0.5rem;
            border-radius: 50px;
            cursor: pointer;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        .settings-panel {
            background: var(--surface-color);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--surface-border);
            border-radius: 16px;
            padding: 2rem;
            max-width: 800px;
        }

        .settings-group {
            margin-bottom: 2.5rem;
        }
        
        .settings-group:last-child {
            margin-bottom: 0;
        }

        .settings-title {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 1px solid var(--surface-border);
            padding-bottom: 0.75rem;
        }

        .form-row {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .form-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .form-input {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--surface-border);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: var(--text-primary);
            font-family: var(--font-family);
            font-size: 1rem;
            transition: all var(--transition-speed);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px var(--primary-glow);
        }
        
        .switch-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            border: 1px solid var(--surface-border);
        }
        
        .switch-label {
            font-weight: 500;
            font-size: 0.95rem;
        }
        
        .switch-desc {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        /* 简单的 Toggle 开关样式 */
        .toggle {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.1);
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--primary-color);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background var(--transition-speed);
        }

        .btn-primary:hover {
            background: #4f46e5;
        }

    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="brand">
            <i class="ph-fill ph-planet"></i>
            AI-Nexus
        </div>
        <ul class="nav-menu">
            <a href="dashboard.html" class="nav-item"><i class="ph ph-squares-four"></i> 仪表盘 Overview</a>
            <a href="sessions.html" class="nav-item"><i class="ph ph-chat-teardrop-text"></i> 活动会话 Sessions</a>
            <a href="model-router.html" class="nav-item"><i class="ph ph-cpu"></i> 算力中心 Model Router</a>
            <a href="token-ledger.html" class="nav-item"><i class="ph ph-coins"></i> 账单明细 Token Ledger</a>
            <a href="gateways.html" class="nav-item"><i class="ph ph-plugs"></i> 渠道网关 Gateways</a>
            <a href="settings.html" class="nav-item active"><i class="ph ph-gear"></i> 核心配置 Settings</a>
        </ul>
    </aside>

    <main class="main-content">
        <header>
            <div class="page-title">
                <h1>核心配置 Settings</h1>
                <p>管理系统全局参数、API 密钥及安全策略。</p>
            </div>
            <div class="header-actions">
                <div class="user-profile">
                    <div class="avatar">A</div>
                    <span style="font-size: 0.9rem; font-weight: 500;">Admin</span>
                    <i class="ph ph-caret-down" style="color: var(--text-secondary)"></i>
                </div>
            </div>
        </header>

        <section class="settings-panel">
            <div class="settings-group">
                <div class="settings-title"><i class="ph ph-shield-check"></i> 访问与安全</div>
                
                <div class="switch-container">
                    <div>
                        <div class="switch-label">强制身份验证 (MFA)</div>
                        <div class="switch-desc">要求所有管理员登录时使用多因素认证。</div>
                    </div>
                    <label class="toggle">
                        <input type="checkbox" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                
                <div class="switch-container">
                    <div>
                        <div class="switch-label">API 速率限制</div>
                        <div class="switch-desc">在网关层自动拦截异常的高频请求。</div>
                    </div>
                    <label class="toggle">
                        <input type="checkbox" checked>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <div class="settings-group">
                <div class="settings-title"><i class="ph ph-key"></i> 密钥管理</div>
                
                <div class="form-row">
                    <label class="form-label">Gemini API Key</label>
                    <input type="password" class="form-input" value="AIzaSyB........................">
                </div>
                
                <div class="form-row">
                    <label class="form-label">OpenAI API Key (Fallback)</label>
                    <input type="password" class="form-input" placeholder="sk-...">
                </div>
            </div>
            
            <button class="btn-primary">保存所有更改</button>
        </section>
    </main>
</body>
</html>
